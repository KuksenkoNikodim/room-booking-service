{% extends "base.html" %}
{% block content %}
<h1>Доступные комнаты</h1>
<div class="row">
    {% for room in rooms %}
    <div class="col-md-4">
        <div class="card mb-3">
            <div class="card-body">
                <h5>{{ room.name }}</h5>
                <p>Вместимость: {{ room.capacity }} чел.</p>
                <p>Оборудование: {{ room.equipment }}</p>
                <a href="/booking/{{ room.id }}" class="btn btn-primary">Забронировать</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
