{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">📝 Бронирование: {{ room.name }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Ваше имя</label>
                        <input type="text" name="user_name" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Дата</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Время начала</label>
                            <input type="time" name="start_time" class="form-control" required>
                        </div>
                        <div class="col">
                            <label class="form-label">Время окончания</label>
                            <input type="time" name="end_time" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Назначение</label>
                        <textarea name="purpose" class="form-control" rows="3" placeholder="Например: Совещание, презентация..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-success">Забронировать</button>
                    <a href="/" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
